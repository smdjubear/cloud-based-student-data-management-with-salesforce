<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RU Login form</title>
    <link rel="icon" href="/img/icon.ico" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <div class="ru">
      <div class="profile">
        <img src="/img/RU_logo.png" alt="RU_Logo" />
        <h1>Rayalaseema University College of Engineering</h1>
        <h5>A State University Established by the Govt. of AP</h5>
        <h5>Kurnool-518007,Andhra Pradesh</h5>
        <h5>Civil | CSE | ECE | Mech</h5>
      </div>
      <form action="Index.html" method="post">
        <div class="login">
          <h2>Welcome 👋</h2>
          <h2>Login</h2>
          <label for="username">Username</label>
          <input
            type="text"
            name=""
            placeholder="rayalaseemauniversity@gmail.com"
            id="username"
            required
          />
          <label for="password">Password</label>
          <input
            type="password"
            name=""
            placeholder="RU@gmail.com"
            id="password"
            required
          />
          <input
            class="login-btn"
            type="submit"
            name=""
            value="Login"
            onclick="login()"
          />
        </div>
      </form>
    </div>
  </body>
</html>
